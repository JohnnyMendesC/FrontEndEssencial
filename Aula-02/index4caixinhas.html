<!DOCTYPE html>
<html lang="en" style="width: 500px;">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula-02</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sofadi+One&display=swap" rel="stylesheet" />
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    .caixinhas {
        width: 50px;
        height: 50px;
    }

    #caixa1 {
        background-color: red;
        position: absolute;
        top: 0;
        right: 0;
    }

    #caixa2 {
        background-color: blue;
        position: absolute;
        bottom: 0;
        right: 0;
    }

    #caixa3 {
        background-color: green;
        position: absolute;
        top: 0;
        left: 0;
    }

    #caixa4 {
        background-color: yellow;
        position: absolute;
        bottom: 0;
        left: 0;
    }

    #caixa5 {
        background-color: purple;
        position: absolute;
        top: calc(50% - 25px);
        left: calc(50% - 25px);

        transition: width 1s, height 1s, ease-in-out 1s;
        /* transition-property: width, height;
        transition-duration: 1s; */
        /* transition-timing-function: ease-in-out;
        transition-delay: 0.5s; */
    }

    #caixa5:hover {
        width: 100px;
        height: 100px;
        /* top: calc(50% - 50px); */
        /* left: calc(50% - 50px); */
        /* width: calc(25% + 100px); */
        /* height: calc(25% + 100px); */
    }
</style>

<body style="height: 500px; width: 500px; border-color: black;">

    <div class="caixinhas" id="caixa1"></div>
    <div class="caixinhas" id="caixa2"></div>
    <div class="caixinhas" id="caixa3"></div>
    <div class="caixinhas" id="caixa4"></div>
    <div class="caixinhas" id="caixa5"></div>

</body>

</html>
