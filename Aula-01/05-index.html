<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<!-- style é onde ficam os estilos utilizados -->
<style>
    /* # referencia id, id é mais pra identificador unico */
    #fotoPerfil {
        width: 64px;
        height: 64px;
        border-radius: 9999px;
        position: absolute; /*a imagem fica na frente de tudo*/
        left: 160px;
        top: 10px;
        opacity: 0.8;
    }

    #imagemFundo {
        background: url('./back.png') no-repeat;
        background-size: cover;


    }

    #titulo {
        background-color: blueviolet;
        width: 140px;
        opacity: 0.8;
    }



    /* . referencia class, class é mais generica */
    .itemLista {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        font-size: 20px;
        /*em pega 20% da superclasse(li pega do ul) e rem pega 20% do browser*/
        letter-spacing: 5px;
        color: aquamarine
            /* pode usar hexadecimal ou escrever o nome da cor*/

    }

    .paiLista {
        background-color: gray;
        width: 500px;
        border-width: 10px;
        border-style: solid;
        border-color: black;
    }

    #divLista {
        background-color: gray;
        width: 500px;
        border-width: 10px;
        border-style: dotted;
        border-color: black
        border 10px dashed blue;
    }
</style>
<!-- selecionando varias linhas e apertando ctrl + ; 
deixa tudo como comentario -->

<body id="imagemFundo">


    <div>
        <img id="fotoPerfil" src="./portrait64.png" alt="Imagem de Perfil">
        <h1 id="titulo">J Mendes</h1>
        <h4>Endereço</h4>
        <ul class="paiLista">
            <li class="itemLista">Cidade Petrópolis</li>
            <li class="itemLista">Rua A</li>
            <li class="itemLista">Número 0</li>
            <li class="itemLista">Bairro Mosela</li>
            <li class="itemLista">CEP 2540500</li>
        </ul>
        <ol id="divLista">
            <h2>Formação Acadêmica</h2>
            <h3>Ensino Superio Completo</h3>
            <h3>Cursando Residência em TIC/SerraTEC</h3>
        </ol>

    </div>


</body>

</html>
